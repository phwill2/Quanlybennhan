name: Supabase Database Keep-Alive

on:
  schedule:
    # Chạy 2 lần mỗi tuần vào thứ Hai và thứ Năm lúc 02:00 UTC (09:00 AM giờ Việt Nam)
    # Giúp reset chu kỳ 7 ngày của Supabase một cách an toàn tuyệt đối, tránh rủi ro nếu trễ lịch
    - cron: '0 2 * * 1,4'
  workflow_dispatch: # Cho phép bấm chạy thử thủ công từ giao diện GitHub Action

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning ::Supabase URL or Anon Key secrets are not configured in GitHub repository secrets. Skipping ping."
            exit 0
          fi
          echo "Pinging Supabase at $SUPABASE_URL to prevent 7-day inactivity pause..."
          ENDPOINT="${SUPABASE_URL%/}/rest/v1/patients?select=id&limit=1"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$ENDPOINT" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase ping successful! Inactivity timer reset."
          else
            echo "::warning ::Supabase returned HTTP $HTTP_STATUS"
          fi
